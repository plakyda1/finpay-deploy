apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments-api-ingress
  namespace: argoctopus
spec:
  ingressClassName: nginx # Modern k8s way for local ingress controllers
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payments-api
                port:
                  number: 80
---
apiVersion: apps/v1                                                                                                                                                                                            
kind: Deployment                                                                                                                                                                                               
metadata: { name: echo-5 }                                                                                                                                                                                     
spec:                                                                                                                                                                                                          
  replicas: 1                                                                                                                                                                                                  
  selector: { matchLabels: { app: echo-5 } }                                                                                                                                                                   
  template:                                                                                                                                                                                                    
    metadata: { labels: { app: echo-5 } }                                                                                                                                                                      
    spec:                                                                                                                                                                                                      
      containers:                                                                                                                                                                                              
        - name: echo                                                                                                                                                                                           
          image: hashicorp/http-echo                                                                                                                                                                           
          args: ["-text=inconclusive", "-listen=:5678"]                                                                                                                                                                   
          ports: [{ containerPort: 5678 }]                                                                                                                                                                     
---                                                                                                                                                                                                            
apiVersion: v1                                                                                                                                                                                                 
kind: Service                                                                                                                                                                                                  
metadata: { name: echo-5 }                                                                                                                                                                                     
spec:                                                                                                                                                                                                          
  selector: { app: echo-5 }                                                                                                                                                                                    
  ports: [{ port: 80, targetPort: 5678 }]                                                                                                                                                                      
---                                                                                                                                                                                                            
apiVersion: argoproj.io/v1alpha1                                                                                                                                                                               
kind: AnalysisTemplate                                                                                                                                                                                         
metadata: { name: always-inconclusive }                                                                                                                                                                        
spec:                                                                                                                                                                                                          
  metrics:                                                                                                                                                                                                     
    - name: inconclusive                                                                                                                                                                                       
      count: 1                                                                                                                                                                                                 
      successCondition: 'result == "win"'    # body is "5" → never true                                                                                                                                        
      failureCondition: 'result == "lose"'   # → never true → Inconclusive                                                                                                                                     
      provider:                                                                                                                                                                                                
        web:                                                                                                                                                                                                   
          url: http://echo-5.lobster.svc/                                                                                                                                                                  
          method: GET                    
---    
apiVersion: argoproj.io/v1alpha1                                                                                                                                                                               
kind: AnalysisTemplate                                                                                                                                                                                         
metadata:                                                                                                                                                                                                      
  name: always-pass                                                                                                                                                                                            
spec:                                                                                                                                                                                                          
  metrics:                                                                                                                                                                                                     
    - name: pass                                                                                                                                                                                               
      count: 1                                                                                                                                                                                                 
      provider:                                                                                                                                                                                                
        job:                                                                                                                                                                                                   
          spec:                                                                                                                                                                                                
            backoffLimit: 0                                                                                                                                                                                    
            template:                                                                                                                                                                                          
              spec:                                                                                                                                                                                            
                restartPolicy: Never                                                                                                                                                                           
                containers:                                                                                                                                                                                    
                  - name: test                                                                                                                                                                                 
                    image: busybox                                                                                                                                                                             
                    command: [sh, -c, "echo ok; exit 0"]
---            
apiVersion: argoproj.io/v1alpha1                                                                                                                                                                               
kind: AnalysisTemplate                                                                                                                                                                                         
metadata:                                                                                                                                                                                                      
  name: always-fail            # swap a step to this to test Failed/aborted                                                                                                                                    
spec:                                                                                                                                                                                                          
  metrics:                                                                                                                                                                                                     
    - name: fail                                                                                                                                                                                               
      count: 1                                                                                                                                                                                                 
      provider:                                                                                                                                                                                                
        job:                                                                                                                                                                                                   
          spec:                                                                                                                                                                                                
            backoffLimit: 0                                                                                                                                                                                    
            template:                                                                                                                                                                                          
              spec:                                                                                                                                                                                            
                restartPolicy: Never                                                                                                                                                                           
                containers:                                                                                                                                                                                    
                  - name: test                                                                                                                                                                                 
                    image: busybox                                                                                                                                                                             
                    command: [sh, -c, "echo nope; exit 1"]                                                                                                                                                     
---                                                                                                                                                                                                            
apiVersion: argoproj.io/v1alpha1                                                                                                                                                                               
kind: AnalysisTemplate                                                                                                                                                                                         
metadata:                                                                                                                                                                                                      
  name: background-rate        # background analysis: repeats during the rollout                                                                                                                               
spec:                                                                                                                                                                                                          
  metrics:                                                                                                                                                                                                     
    - name: rate                                                                                                                                                                                               
      count: 10                                                                                                                                                                                                
      interval: 30s                                                                                                                                                                                            
      provider:                                                                                                                                                                                                
        job:                                                                                                                                                                                                   
          spec:                                                                                                                                                                                                
            backoffLimit: 0                                                                                                                                                                                    
            template:                                                                                                                                                                                          
              spec:                                                                                                                                                                                            
                restartPolicy: Never                                                                                                                                                                           
                containers:                                                                                                                                                                                    
                  - name: test                                                                                                                                                                                 
                    image: busybox                                                                                                                                                                             
                    command: [sh, -c, "exit 0"]   
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payments-api
  namespace: argoctopus
  labels:
    app: payments-api
spec:
  replicas: 5
  # strategy:
  #   blueGreen:
  #     activeService: payments-api
  #     previewService: payments-api-preview
  strategy:
    canary:                                                                                                                                                                                                    
      stableService: payments-api          # Defines the stable service
      canaryService: payments-api-preview  # Defines the canary service
      trafficRouting:
        nginx:
          stableIngress: payments-api-ingress  # References the Ingress resource below
      analysis:                                     
        startingStep: 1                                                                                                                                                                                        
        templates:                                                                                                                                                                                             
          - templateName: background-rate                                                                                                                                                                      
      steps:                                                                                                                                                                                                   
        - setWeight: 30                             # Step 0: Traffic router shifts exactly 30% traffic to canary
        - analysis:                                 
            templates:                                                                                                                                                                                         
              - templateName: always-pass                                                                                                                                                                      
        - experiment:                               
            duration: 2m                                                                                                                                                                                       
            templates:                                                                                                                                                                                         
              - name: canary                                                                                                                                                                                   
                specRef: canary                                                                                                                                                                                
            analyses:                                                                                                                                                                                          
              - name: smoke                                                                                                                                                                                    
                templateName: always-pass                                                                                                                                                                      
        - setWeight: 50                             # Step 3: Traffic router shifts exactly 50% traffic to canary
        - pause: { duration: 30s }                  
        - setWeight: 100                            # Step 5: Traffic router shifts 100% traffic to canary
  # strategy:
  #   canary:                                                                                                                                                                                                    
  #     analysis:                                     # ← BACKGROUND  → name {prefix}, rollout-type=Background                                                                                                   
  #       startingStep: 1                                                                                                                                                                                        
  #       templates:                                                                                                                                                                                             
  #         - templateName: background-rate                                                                                                                                                                      
  #     steps:                                                                                                                                                                                                   
  #       - setWeight: 30                             # step 0                                                                                                                                                   
  #       - analysis:                                 # step 1 ← STEP analysis → {prefix}-1, rollout-type=Step                                                                                                   
  #           templates:                                                                                                                                                                                         
  #             - templateName: always-pass                                                                                                                                                                      
  #       - experiment:                               # step 2 ← EXPERIMENT → {prefix}-2 (+ its 'smoke' run)                                                                                                     
  #           duration: 2m                                                                                                                                                                                       
  #           templates:                                                                                                                                                                                         
  #             - name: canary                                                                                                                                                                                   
  #               specRef: canary                                                                                                                                                                                
  #           analyses:                                                                                                                                                                                          
  #             - name: smoke                                                                                                                                                                                    
  #               templateName: always-pass                                                                                                                                                                      
  #       - setWeight: 50                             # step 3                                                                                                                                                   
  #       - pause: { duration: 30s }                  # step 4          
  #       # - analysis:                       
  #       #     templates:                                                                                                                                                                                         
  #       #       - templateName: always-inconclusive                                                                                                                                                 
  #       - setWeight: 100                            # step 5
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: payments-api
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          env:
            - name: LOG_LEVEL
              value: "debug"
            - name: DB_HOST
              value: "postgres-dev.finpay.internal"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: argoctopus
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: payments-api
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api-preview
  namespace: argoctopus
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: payments-api
---
  apiVersion: argoproj.io/v1alpha1                                                                                                           
  kind: AnalysisTemplate                                                                                                                   
  metadata:
    name: payments-api-noop
    namespace: argoctopus                                                                                                                    
  spec:
    metrics:                                                                                                                                 
      - name: always-pass                                                                                                                  
        interval: 10s
        count: 3
        provider:
          job:
            spec:                                                                                                                            
              backoffLimit: 0
              template:                                                                                                                      
                spec:                                                                                                                      
                  containers:
                    - name: noop
                      image: alpine:3.18
                      command: ["sh", "-c", "exit 0"]                                                                                        
                  restartPolicy: Never